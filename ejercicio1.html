<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Demostración 1</title>
    </head>
     
    <body>
    <p id="parrafo"></p>
    <button onclick="Nuevotexto()">
        Actualizar Texto
    </button>
    <script>
        function Nuevotexto(){
            document.getElementById("parrafo").innerHTML = "Mira este nuevo texto";
        }
    </script>
    </body>
</html>
